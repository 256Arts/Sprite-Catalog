# Read by the shared `screenshots` runner in Repos/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Sprite Catalog.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.spritecatalog"
MAC_APP_NAME="Sprite Catalog"
PLATFORMS="iphone ipad mac vision"

# The Mac build is a native macOS app, so the plain destination matches it. It was Catalyst until
# the app target turned SUPPORTS_MACCATALYST off, when `variant=Mac Catalyst` stopped resolving.
# Nothing else here is platform-specific: the runner finds the window to photograph by the owning
# process's name, which is `MAC_APP_NAME` above, and never by a bundle path or a window title.
MAC_DESTINATION="platform=macOS"

# What each shot shows, for the "Screenshots.md" the run writes beside them. Keyed by the UI test's
# capture name without its "NN-" prefix.
SHOT_DESCRIPTIONS="
  food          = The Food collection's sprite grid
  tiles         = The Tiles collection's sprite grid
  font          = The Alkhemikal pixel font's detail screen, the family blown up to its whole alphabet
  palettes      = The Palettes collection, each palette's colors as a tile
  my-collection = My Collection, the sprites saved out of the catalog
  cutter        = The spritesheet cutter sheet, over the Artwork grid (over the sidebar on the iPhone,
                  where the sidebar has to come back to reach the button)
  sprite        = One sprite's detail screen — hippo's diamond, from the Treasure collection
"

# The app's folder on the 256 Arts site. `--upload` refreshes the shots its page shows from
# the ones here, resized to the frame that page draws.
WEBSITE_SLUG="spritecatalog"

# The headline each shot is sold under on the website, written from the sentence in
# SHOT_DESCRIPTIONS that says what it shows. Keyed the same way, so a line follows its shot
# when the listing reorders.
SHOT_PROMOS="
  food          = Thousands of sprites, ready to use.
  tiles         = Tiles and terrain to build a whole world out of.
  font          = Pixel fonts, with every letter already drawn.
  palettes      = Palettes that keep a game in key.
  my-collection = Keep the ones you want, in one collection.
  cutter        = Cut a spritesheet into sprites in a single pass.
  sprite        = Open any sprite in Sprite Pencil and make it yours.
"
