# Read by the shared `screenshots` runner in Apps/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Sprite Catalog.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.spritecatalog"
MAC_APP_NAME="Sprite Catalog"
PLATFORMS="iphone ipad mac vision"

# The Mac build is Catalyst, not native AppKit, so the macOS destination needs its variant named —
# `platform=macOS` alone does not match a Catalyst-only target.
MAC_DESTINATION="platform=macOS,variant=Mac Catalyst"
