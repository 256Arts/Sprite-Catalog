# Read by the shared `screenshots` runner in Repos/Scripts. Anything not set takes that script's
# defaults — device names, canvas size, and the wallpaper backdrop.

PROJECT="Sprite Catalog.xcodeproj"
SCHEME="Screenshots"
APP_BUNDLE_ID="com.jaydenirwin.spritecatalog"
MAC_APP_NAME="Sprite Catalog"
PLATFORMS="iphone ipad mac vision"

# The Mac build is a native macOS app, so the plain destination matches it. It was Catalyst until
# the app target turned SUPPORTS_MACCATALYST off, when `variant=Mac Catalyst` stopped resolving.
# Nothing else here is platform-specific: the runner finds the window to photograph by the owning
# process's name, which is `MAC_APP_NAME` above, and never by a bundle path or a window title.
MAC_DESTINATION="platform=macOS"
